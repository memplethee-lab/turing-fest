events {}
http {
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://api:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";          # required for SSE to stream, not buffer
            proxy_buffering off;
        }
    }
}
