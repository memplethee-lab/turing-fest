<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- CSP: tokens live in localStorage; a strict policy is the cheap big win
     against token exfiltration via injected script. connect-src stays same-origin. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'" />
<title>Hackfest Workspace</title>
<link rel="stylesheet" href="vendor/codemirror.min.css" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262a33; --text: #e6e6e6;
    --muted: #9aa4b2; --accent: #60a5fa; --accent-dim: #2c3b52;
    --good: #34d399; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); display: flex; gap: 1rem; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  #timer { font-variant-numeric: tabular-nums; color: var(--warn); }
  header a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.6rem 0 0.25rem; }
  input, select, textarea { width: 100%; background: #0d0f13; border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.6rem; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
  button.action { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 0.5rem 1rem; cursor: pointer; font-size: 0.85rem; margin-top: 0.6rem; margin-right: 0.4rem; }
  button.danger { color: var(--bad); border-color: var(--bad); background: #3a2323; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .muted { color: var(--muted); font-size: 0.8rem; }
  .status { font-size: 0.95rem; margin-top: 0.5rem; }
  .status-ok { color: var(--good); }
  .status-bad { color: var(--bad); }
  .status-warn { color: var(--warn); }
  #login-screen { max-width: 360px; margin: 4rem auto; }
  #split { display: grid; grid-template-columns: 46% 54%; height: calc(100vh - 46px); }
  #divider { grid-column: 1; height: 100%; width: 6px; margin-left: -3px; background: var(--border); cursor: col-resize; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  #left { grid-row: 1; padding: 1rem; overflow-y: auto; border-right: none; }
  #right { grid-row: 1; display: flex; flex-direction: column; min-width: 0; }
  #filebar { display: flex; gap: 0.25rem; padding: 0.5rem 0.75rem 0; flex-wrap: wrap; }
  #filebar button { background: none; color: var(--muted); border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.85rem; }
  #filebar button.active { color: var(--text); border-color: var(--accent); }
  .sig { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.75rem; gap: 0.5rem; }
  #submit-row { display: flex; gap: 0.4rem; padding-bottom: 0.6rem; }
  .briefing { font-size: 0.92rem; line-height: 1.55; }
  .briefing h1, .briefing h2 { color: var(--accent); }
  .briefing pre { background: #0d0f13; border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; overflow-x: auto; }
  .briefing code { color: var(--warn); }
  .checks { list-style: none; padding: 0; margin: 0.4rem 0 0; font-size: 0.85rem; }
  .checks li::before { content: "✓ "; color: var(--good); }
  .checks li.fail::before { content: "✗ "; color: var(--bad); }
  .checks li.fail { color: var(--bad); }
  .CodeMirror { height: auto; flex: 1; border: 1px solid var(--border); background: #0d0f13; color: var(--text); font-family: ui-monospace, Consolas, monospace; }
  .cm-editor { font-size: 0.9rem; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="panel">
    <h2>Team login</h2>
    <label>Log in as</label>
    <select id="who">
      <option value="team">Team (shared name + password)</option>
      <option value="user">Personal account (username)</option>
    </select>
    <label id="name-label">Team name</label>
    <input id="name" />
    <label>Password</label>
    <input id="pass" type="password" onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="action" onclick="doLogin()">Log in</button>
    <p class="muted" id="login-msg"></p>
    <p class="muted">No account yet? <a href="#" onclick="doRegister(event)" style="color:var(--accent)">Register a team</a></p>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>🛠 Hackfest Workspace</h1>
    <span id="timer" title="Times from the server; enforcement is server-side"></span>
    <a href="/" target="_blank">Leaderboard ↗</a>
    <button class="action" style="margin:0;" onclick="doLogout()">Log out</button>
  </header>
  <div id="split">
    <div id="left" class="panel" style="border:none; border-radius:0;">
      <label>Challenge</label>
      <select id="challenge-select" onchange="pickChallenge()"></select>
      <h2 style="font-size:0.95rem; color:var(--muted); text-transform:uppercase;">Briefing</h2>
      <div id="briefing" class="briefing muted">select a challenge…</div>
      <h2 style="font-size:0.95rem; color:var(--muted); text-transform:uppercase;">Last submission</h2>
      <div id="sub-status" class="muted">nothing submitted yet</div>
      <ul id="sub-checks" class="checks"></ul>
    </div>
    <div id="right">
      <div class="sig"><div id="filebar"></div></div>
      <textarea id="code"></textarea>
      <div class="sig" id="submit-row">
        <span id="draft-note" class="muted"></span>
        <span style="flex:1;"></span>
        <button class="action" style="margin:0;" onclick="resetFile()">Reset file ⚠</button>
        <button id="submit-btn" class="action" style="margin:0;" onclick="doSubmit()">Submit (Ctrl+Enter)</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/codemirror.min.js"></script>
<script src="vendor/codemirror-mode-javascript.min.js"></script>
<script>
// No CodeMirror mode import issue: the vendored UMD bundle registers
// globally as CodeMirror; common-lisp/python modes aren't loaded here — TS
// files highlight via the javascript mode (rough but readable).
const cm = CodeMirror.fromTextArea(document.getElementById("code"), {
  mode: "javascript",
  theme: "default",
  lineNumbers: true,
  indentUnit: 2,
  tabSize: 2,
  extraKeys: {
    "Ctrl-Enter": doSubmit,
    "Tab": cmInstance => cmInstance.somethingSelected()
      ? cmInstance.indentSelection("add") : cmInstance.replaceSelection("  ", "end"),
  },
});

const API = "/api";
let token = localStorage.getItem("hackfest_token");
let me = null;            // {kind: "team"|"user", name}
let challengeList = [];
let currentChallenge = null;   // {slug, title, ...}
let startFiles = {};           // {filename: originalContent}
let openFile = null;
let submitWatch = null;

function headers() {
  return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
}

async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
  if (res.status === 401 || res.status === 403) { doLogout(); throw new Error("please log in again"); }
  if (!res.ok) { let detail = res.statusText; try { detail = (await res.json()).detail || detail; } catch { /* html error page */ } throw new Error(detail); }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.text();
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const escBrief = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

// minimal markdown render (enough for briefings; never trusts raw HTML)
function briefMarkdown(md) {
  const lines = escBrief(md).split("\n");
  let out = "", inCode = false, codeBuf = [];
  for (const line of lines) {
    if (line.startsWith("```")) { if (inCode) { out += `<pre><code>${codeBuf.join("\n")}</code></pre>`; codeBuf = []; } inCode = !inCode; continue; }
    if (inCode) { codeBuf.push(line); continue; }
    const h = /^(#{1,4})\s+(.*)/.exec(line);
    if (h) { out += `<h${h[1].length}>${h[2]}</h${h[1].length}>`; continue; }
    out += line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>") + "<br />";
  }
  if (inCode && codeBuf.length) out += `<pre><code>${codeBuf.join("\n")}</code></pre>`;
  return out;
}

// ---------- auth ----------
async function doLogin() {
  const msg = document.getElementById("login-msg");
  try {
    const who = document.getElementById("who").value;
    const name = document.getElementById("name").value.trim();
    const pass = document.getElementById("pass").value;
    if (!name || !pass) { msg.textContent = "fill in all fields"; return; }
    const url = who === "team" ? "/teams/login" : "/users/login";
    const r = await fetch(`${API}${url}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(who === "team" ? { name, password: pass } : { username: name, password: pass }),
    });
    if (!r.ok) { let d = "login failed"; try { d = (await r.json()).detail || d; } catch { /* non-json */ } throw new Error(d); }
    const data = await r.json();
    token = data.token;
    localStorage.setItem("hackfest_token", token);
    me = { kind: who, name, team_id: data.team_id != null ? String(data.team_id) : null };
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadWorkspace();
  } catch (e) { msg.textContent = capMessage(e.message); }
}

async function doRegister(ev) {
  ev.preventDefault(); ev.stopPropagation();
  const msg = document.getElementById("login-msg");
  try {
    const name = document.getElementById("name").value.trim();
    const pass = document.getElementById("pass").value;
    if (!name || !pass) { msg.textContent = "fill in team name and password first"; return; }
    const event_id = prompt("Event ID (from the organizers) — pastes it into the register call");
    if (!event_id) return;
    const r = await fetch(`${API}/teams/register`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ event_id, name, password: pass }),
    });
    if (!r.ok) { let d = "registration failed"; try { d = (await r.json()).detail || d; } catch { /* non-json */ } throw new Error(d); }
    msg.textContent = `registered with event ${event_id.slice(0, 8)}… — now log in`;
  } catch (e) { msg.textContent = capMessage(e.message); }
}

function doLogout() {
  localStorage.removeItem("hackfest_token");
  token = null;
  document.getElementById("app").style.display = "none";
  document.getElementById("login-screen").style.display = "block";
}
const capMessage = m => String(m || "").slice(0, 160);

// ---------- workspace ----------
let eventWindow = null; // {start_at, end_at}
let timerHandle = null;

async function loadWorkspace() {
  const list = await api("/challenges");   // {status, start_at, end_at, challenges}
  eventWindow = { start_at: list.start_at && new Date(list.start_at), end_at: list.end_at && new Date(list.end_at), status: list.status };
  challengeList = list.challenges || [];
  const sel = document.getElementById("challenge-select");
  sel.innerHTML = challengeList.map(c =>
    `<option value="${esc(c.slug)}">${esc(c.title)}${c.solved ? " ✓" : ""}</option>`).join("")
    || `<option value="" disabled>no challenges visible yet</option>`;
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(updateTimer, 1000);
  updateTimer();
  const last = localStorage.getItem("hackfest_last_challenge");
  if (last && challengeList.some(c => c.slug === last)) { sel.value = last; }
  await pickChallenge();
}

function updateTimer() {
  const t = document.getElementById("timer");
  if (!eventWindow || !eventWindow.end_at) { t.textContent = "—"; return; }
  const ms = eventWindow.end_at - Date.now();
  if (ms <= 0) { t.textContent = "event ended"; return; }
  if (eventWindow.start_at && Date.now() < eventWindow.start_at) { t.textContent = "starts soon"; return; }
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  t.textContent = `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")} left`;
}

function tabsBar() {
  const bar = document.getElementById("filebar");
  bar.innerHTML = Object.keys(editorContents()).map(f =>
    `<button class="${f === openFile ? "active" : ""}" onclick="pickFile('${esc(f)}')">${esc(f)}</button>`).join("");
}

function editorContents() {
  // current buffers: the active file's live CodeMirror doc + untouched others
  const out = Object.assign({}, startFiles);
  if (openFile != null) out[openFile] = cm.getValue();
  return out;
}

async function pickChallenge() {
  const slug = document.getElementById("challenge-select").value;
  if (!slug) return;
  currentChallenge = challengeList.find(c => c.slug === slug);
  localStorage.setItem("hackfest_last_challenge", slug);
  const briefing = await api(`/challenges/${slug}`);
  document.getElementById("briefing").innerHTML = briefMarkdown(briefing.briefing_md || "");
  document.getElementById("sub-status").textContent = "loading files…";
  const start = await api(`/challenges/${slug}/start`);
  startFiles = start.files;
  if (!Object.keys(startFiles).length) {
    document.getElementById("briefing").innerHTML +=
      `<p class="status-bad">organizers haven't seeded starting files for this challenge — ask them to paste them in the admin Challenge form.</p>`;
  }
  await restoreDrafts(slug);
  openFile = Object.keys(startFiles)[0] || null;
  cm.setValue(openFile ? startFiles[openFile] ?? "" : "");
  tabsBar();
  document.getElementById("sub-status").textContent = "nothing submitted yet on this page load (history is on the leaderboard)";
}

async function restoreDrafts(slug) {
  const files = Object.keys(startFiles);
  for (const f of files) {
    try {
      const d = await api(`/challenges/${slug}/draft/${encodeURIComponent(f)}`);
      if (d && d.content && d.content !== startFiles[f]) {
        startFiles[f] = d.content;
        noteDraft(`draft restored for ${f}`);
        if (openFile === f) cm.setValue(d.content);
      }
    } catch { /* drafts are best-effort */ }
  }
}

function pickFile(name) {
  if (name === openFile) return;
  openFile = name;
  cm.setValue((startFiles[name] || ""));
  tabsBar();
}

async function resetFile() {
  if (!currentChallenge || !openFile) return;
  if (!confirm(`Reset ${openFile} to the ORIGINAL content from the server?\nYour edits in this file will be lost.`)) return;
  try {
    const start = await api(`/challenges/${currentChallenge.slug}/start`);
    if (!(openFile in start.files)) { noteDraft("file no longer exists upstream — refresh the page"); return; }
    startFiles[openFile] = start.files[openFile];
    await saveDraft();
    cm.setValue(start.files[openFile]);
    noteDraft("file reset");
  } catch (e) { noteDraft(`reset failed: ${capMessage(e.message)}`); }
}

let draftTimer = null;
function noteDraft(text) { document.getElementById("draft-note").textContent = text; }

async function saveDraft() {
  if (!currentChallenge || !openFile) return;
  try {
    await api(`/challenges/${currentChallenge.slug}/draft/${encodeURIComponent(openFile)}`, {
      method: "PUT", body: JSON.stringify({ content: cm.getValue() }),
    });
    noteDraft(`draft saved ${new Date().toLocaleTimeString()}`);
  } catch (e) { noteDraft(`draft save failed: ${capMessage(e.message)}`); }
}

cm.on("change", () => {
  if (!currentChallenge) return;
  if (draftTimer) clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraft, 1500);
});

// ---------- submit & status ----------
async function doSubmit() {
  if (!currentChallenge || !openFile) return;
  const btn = document.getElementById("submit-btn");
  try {
    btn.disabled = true;
    const files = editorContents();
    const res = await api("/submissions", {
      method: "POST",
      body: JSON.stringify({ challenge_slug: currentChallenge.slug, files }),
    });
    document.getElementById("sub-status").textContent = "queued…";
    watchSubmission(res.submission_id);
  } catch (e) {
    document.getElementById("sub-status").textContent = capMessage(e.message);
    document.getElementById("sub-status").className = "status status-bad";
  } finally { btn.disabled = false; }
}

function watchSubmission(id) {
  if (submitWatch) clearInterval(submitWatch);
  const el = document.getElementById("sub-status"), checksEl = document.getElementById("sub-checks");
  submitWatch = setInterval(async () => {
    try {
      const s = await api(`/submissions/${id}`);
      if (s.status === "queued" || s.status === "running") { el.textContent = s.status + "…"; return; }
      clearInterval(submitWatch); submitWatch = null;
      const grade = s.status === "passed" ? ["status status-ok", `passed — scored`] : s.status === "failed" ? ["status status-bad", "failed"] : ["status status-warn", s.status];
      el.textContent = grade[1];
      el.className = grade[0];
      checksEl.innerHTML = (s.checks || []).map(c =>
        `<li class="${c.pass ? "" : "fail"}">${esc(c.check || "...")}</li>`).join("") ||
        (s.status === "passed" ? "" : `<li class="fail">no check details available</li>`);
    } catch { /* transient */ }
  }, 2000);
}

// ---------- pane divider ----------
(function initDivider() {
  const divider = document.getElementById("divider");
  const setCols = pct => { document.getElementById("split").style.gridTemplateColumns = `${pct}% ${100 - pct}%`; };
  let dragging = false;
  divider.addEventListener("mousedown", e => { dragging = true; e.preventDefault(); });
  window.addEventListener("mousemove", e => { if (dragging) setCols(Math.max(25, Math.min(75, (e.clientX / document.getElementById("split").offsetWidth) * 100))); });
  window.addEventListener("mouseup", () => { if (dragging) { dragging = false; cm.refresh(); } });
})();

if (token) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadWorkspace().catch(e => {
    document.getElementById("briefing").textContent = e.message;
    document.getElementById("briefing").className = "briefing status-bad";
  });
} else {
  document.getElementById("login-screen").style.display = "block";
}
</script>
</body>
</html>
