version: "3.9"

# Postgres now lives in Neon (see DATABASE_URL in .env) — no local db
# container. Apply the schema once with: python scripts/apply_schema.py

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-changeme-too}
      FLAG_SECRET: ${FLAG_SECRET:-changeme-flag-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-admin}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SUBMISSION_COOLDOWN_SECONDS: ${SUBMISSION_COOLDOWN_SECONDS:-60}
      SUBMISSIONS_PER_HOUR: ${SUBMISSIONS_PER_HOUR:-20}
    depends_on:
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./challenges:/challenges:ro   # worker + api both need challenge definitions

  worker:
    build: ./worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./challenges:/challenges:ro
      - /var/run/docker.sock:/var/run/docker.sock   # worker launches sibling containers to grade submissions
    deploy:
      replicas: 3   # 3 concurrent judge workers; plenty for 50 teams

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - api
